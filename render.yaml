# Render Blueprint — one-click deploy: https://render.com → New → Blueprint → pick this repo.
# Free plan: the app sleeps after ~15 min idle (first visit then takes ~30-50s to wake),
# and the SQLite file resets on each deploy/restart — the demo data is re-created automatically.
services:
  - type: web
    name: grit-interviews
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_demo --if-empty && gunicorn grit.wsgi --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /login/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render creates a strong random key
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: GRIT_DEMO_MODE
        value: "1"                   # keep one-click demo logins for reviewers
